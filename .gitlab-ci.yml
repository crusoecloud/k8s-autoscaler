variables:
  MODULE_DIR: &module_dir "cluster-autoscaler/"
  PLATFORMS: "linux/amd64"

include:
  - component: $CI_SERVER_FQDN/crusoeenergy/tools/mise@shiqi-helm-job-prefix
    inputs:
      dir: *module_dir
  - component: $CI_SERVER_FQDN/crusoeenergy/tools/go@shiqi-helm-job-prefix
    inputs:
      go_mod_dir: *module_dir
      job_prefix: ""
      # This upstream fork's releases and tags are owned by GitHub Actions.
      tag_version: "false"

.go_mise:
  variables:
    GOFLAGS: "-mod=vendor"
    GOPATH: "${CI_PROJECT_DIR}/.cache/gopath"
    XDG_CACHE_HOME: "${CI_PROJECT_DIR}/.cache"

# The runtime Dockerfile is at repository root, outside go_mod_dir. Include it
# in the producer and publisher rules so a Dockerfile-only change rebuilds the
# image with the required version and binary artifacts.
.cluster_autoscaler_artifact_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - changes:
        - $MODULE_DIR**/*
        - Dockerfile.cluster-autoscaler-amd64
        - .gitlab-ci.yml
        - .golangci.yml
        - mise.toml
        - go.work

# Use the glci built by Pangaea !2433's passing build. The parent starts in
# the module; generated child jobs start at repository root, so retain both paths.
custom_glci:
  image: !reference [.mise, image]
  stage: .pre
  rules: !reference [.cluster_autoscaler_artifact_rules, rules]
  script:
    - |
      curl --fail --silent --show-error --location \
        "${CI_API_V4_URL}/projects/74118899/jobs/18013965264/artifacts/custom_glci?job_token=${CI_JOB_TOKEN}" \
        --output "${CI_PROJECT_DIR}/custom_glci"
      chmod +x "${CI_PROJECT_DIR}/custom_glci"
      cp "${CI_PROJECT_DIR}/custom_glci" "${CI_PROJECT_DIR}/${MODULE_DIR}custom_glci"
  artifacts:
    paths:
      - custom_glci
      - ${MODULE_DIR}custom_glci

versions:
  rules: !reference [.cluster_autoscaler_artifact_rules, rules]

go_build:
  parallel:
    matrix:
      - GOOS: ["linux"]
        GOARCH: ["amd64"]
  rules: !reference [.cluster_autoscaler_artifact_rules, rules]

# Temporary branch validation until the shared tools and Pangaea changes are rolled out.
pre_publish_artifacts:
  variables:
    GLCI_CMD_MATRIX_TOOLS_REF: "shiqi-helm-job-prefix"
    GLCI_CMD_MATRIX_CUSTOM_GLCI: "true"
  rules: !reference [.cluster_autoscaler_artifact_rules, rules]

publish_artifacts:
  rules: !reference [.cluster_autoscaler_artifact_rules, rules]

# Vendored dependencies already supply this fork's builds and provider tests.
# Do not replace them with a full upstream-module download/tidy operation.
pre_go_deps:
  parallel:
    matrix:
      - GOARCH: "amd64"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success
  script:
    - test -f vendor/modules.txt
    - go version

# The baseline GitLab check runs only this provider, without coverage/race.
# Preserve that boundary instead of starting upstream suites for other clouds.
go_test:
  coverage: null
  artifacts: null
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /^crusoe-cluster-autoscaler-/ && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && !$CI_MERGE_REQUEST_ID'
      when: never
    - !reference [.go_rules, rules]
  script:
    - mise run test:provider

# These were not checks in the existing GitLab pipeline. Upstream GitHub
# workflows and Make targets remain intact; this migration does not widen them.
go_test_race:
  rules: [{ when: never }]
go_generate:
  rules: [{ when: never }]
go_mod_tidy:
  rules: [{ when: never }]
golangci_lint:
  rules: [{ when: never }]
go_publish_docs:
  rules: [{ when: never }]
publish_pages:
  rules: [{ when: never }]
