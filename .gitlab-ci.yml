include:
  - component: $CI_SERVER_FQDN/crusoeenergy/tools/mise@master
  - component: $CI_SERVER_FQDN/crusoeenergy/tools/go@master
    inputs:
      go_mod_dir: "cluster-autoscaler/"
      # This upstream fork's releases and tags are owned by GitHub Actions.
      tag_version: "false"
  - component: $CI_SERVER_FQDN/crusoeenergy/tools/docker@master

variables:
  PLATFORMS: "linux/amd64"

# The repository root has no go.mod. Install and activate tools at the one
# participating module, using its go.mod/toolchain directive and tool lock.
.mise:
  cache:
    - key:
        files:
          - cluster-autoscaler/mise.lock
          - cluster-autoscaler/mise.toml
      paths: ["${MISE_DATA_DIR}"]
      policy: "${MISE_CACHE_POLICY}"

pre_mise:
  before_script:
    - cd "${CI_PROJECT_DIR}/cluster-autoscaler"
    - !reference [.mise, before_script]

.go_mise:
  variables:
    GOFLAGS: "-mod=vendor"
    GOPATH: "${CI_PROJECT_DIR}/.cache/gopath"
    XDG_CACHE_HOME: "${CI_PROJECT_DIR}/.cache"
  before_script:
    - cd "${CI_PROJECT_DIR}/cluster-autoscaler"
    - !reference [.mise, before_script]
    - go version
    - go env

.image_publish_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_MERGE_REQUEST_ID'
      when: always

# Vendored dependencies already supply this fork's builds and provider tests.
# Do not replace them with a full upstream-module download/tidy operation.
cluster-autoscaler/pre_go_deps:
  parallel:
    matrix:
      - GOARCH: "amd64"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success
  script:
    - test -f vendor/modules.txt
    - go version

cluster-autoscaler/versions:
  rules: !reference [.image_publish_rules, rules]

cluster-autoscaler/go_build:
  variables:
    CGO_ENABLED: "0"
  parallel:
    matrix:
      - GOOS: ["linux"]
        GOARCH: ["amd64"]
  rules: !reference [.image_publish_rules, rules]
  script:
    - export GO_BUILD_DIR="${CI_PROJECT_DIR}/bin/${GOOS}-${GOARCH}"
    - cd "${CI_PROJECT_DIR}/cluster-autoscaler"
    - mise run go:build -- -ldflags=-s .

# The baseline GitLab check runs only this provider, without coverage/race.
# Preserve that boundary instead of starting upstream suites for other clouds.
cluster-autoscaler/go_test:
  coverage: null
  artifacts: null
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /^crusoe-cluster-autoscaler-/ && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && !$CI_MERGE_REQUEST_ID'
      when: never
    - !reference [.cluster-autoscaler/go_rules, rules]
  script:
    - mise run test:provider

# These were not checks in the existing GitLab pipeline. Upstream GitHub
# workflows and Make targets remain intact; this migration does not widen them.
cluster-autoscaler/go_test_race:
  rules: [{ when: never }]
cluster-autoscaler/go_generate:
  rules: [{ when: never }]
cluster-autoscaler/go_mod_tidy:
  rules: [{ when: never }]
cluster-autoscaler/golangci_lint:
  rules: [{ when: never }]
cluster-autoscaler/go_publish_docs:
  rules: [{ when: never }]
publish_pages:
  rules: [{ when: never }]

# This fork has no selected artifacts manifest or module chart publisher.
# Keep artifact discovery out of its large upstream/vendor tree.
cluster-autoscaler/pre_publish_artifacts:
  rules: [{ when: never }]
cluster-autoscaler/publish_artifacts:
  rules: [{ when: never }]

# Reuse the shared builder with the existing repository/raw-ref destination.
# The root Dockerfile suffix deliberately preserves /cluster-autoscaler-amd64.
build_and_push_image:
  extends: .publish_docker_image
  needs:
    - job: cluster-autoscaler/versions
    - job: "cluster-autoscaler/go_build: [linux, amd64]"
  variables:
    DOCKERFILE: Dockerfile.cluster-autoscaler-amd64
    DOCKER_PLATFORMS: "linux/amd64"
  # The Go component prefixes its release metadata with the module path.
  # Docker tags need the unprefixed value; GitHub still owns Git release tags.
  before_script:
    - export RELEASE_VERSION="${TRIMMED_RELEASE_VERSION:?missing shared version artifact}"
  after_script:
    - export RELEASE_VERSION="${TRIMMED_RELEASE_VERSION}"
    - !reference [.publish_docker_image_base, after_script]
  rules: !reference [.image_publish_rules, rules]
