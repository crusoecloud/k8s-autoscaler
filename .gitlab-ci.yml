include:
  - project: 'crusoeenergy/tools'
    file: '/templates/go.gitlab-ci.yml'

variables:
  CI_IMAGE: registry.gitlab.com/crusoeenergy/tools/go-ci-1.22
  SUBPROJECT: cluster-autoscaler
  SUBPROJECT_PATH: cluster-autoscaler/
  SUBPROJECT_REL_PATH: ./cluster-autoscaler

# stages:
#   - test
#   - build

default:
  tags:
    # to unblock build in case Crusoe's gitlab-runner is unavailable
    - gitlab-runner-gcp

test_and_lint:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH !~ /^crusoe-cluster-autoscaler-/'
      changes: !reference [.code-changes, changes]
    - if: '$CI_MERGE_REQUEST_ID'
      changes: !reference [.code-changes, changes]
    # don't run CI for semver tags, do run it for custom tags
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG !~ /^crusoe-cluster-autoscaler-release-[0-9]+\.[0-9]+\.[0-9]+.+/'

# Remove the tag_semver and pages jobs from merges into main.
# The tag_semver job will be run using a GitHub action instead
# and new versions will be pushed then.
tag_semver:
  rules:
    - when: never

code_intelligence:
  rules:
    - when: never

pages:
  rules:
    - when: never

build_and_push_image:
  stage: build
  services:
    - docker:20.10.24-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - chmod +x cluster-autoscaler/push_image.sh
    # download docker because to the image as it is required by the cluster-autoscaler make commands
    - apt-get update && apt-get install -y apt-transport-https ca-certificates curl gnupg
    - curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
    - echo "deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/debian bullseye stable" > /etc/apt/sources.list.d/docker.list
    - apt-get update && apt-get install -y docker-ce-cli
    # authenticate to gitlab with crusoe's pipeline job token
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN registry.gitlab.com
  script:
    - cd cluster-autoscaler
    - make build-arch-amd64
    - export IMAGE=registry.gitlab.com/crusoeenergy/island/k8s-autoscaler/cluster-autoscaler
    - export TAG=$CI_COMMIT_REF_NAME
    - export ALL_ARCH="amd64"
    - make make-image-arch-amd64
    - make push-image-arch-amd64
    - make push-manifest
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: always
    - if: '$CI_MERGE_REQUEST_ID'
      when: always

