include:
  - component: $CI_SERVER_FQDN/crusoeenergy/tools/mise@master
  - component: $CI_SERVER_FQDN/crusoeenergy/tools/wiz-deps@master
  - component: $CI_SERVER_FQDN/crusoeenergy/tools/go@master
    inputs:
      go_mod_dir: "cluster-autoscaler/"
      # This upstream fork's releases and tags are owned by GitHub Actions.
      tag_version: "false"

variables:
  PLATFORMS: "linux/amd64"

# Shared setup starts at the repository root, which has no go.mod.
# Install and activate tools in the module and use its lock/config cache key.
.mise:
  cache:
    - key:
        files:
          - cluster-autoscaler/mise.lock
          - cluster-autoscaler/mise.toml
      paths: ["${MISE_DATA_DIR}"]
      policy: "${MISE_CACHE_POLICY}"

pre_mise:
  before_script:
    - cd "${CI_PROJECT_DIR}/cluster-autoscaler"
    - !reference [.mise, before_script]

.go_mise:
  variables:
    # Shared jobs default to -mod=readonly; this fork builds from committed vendor.
    GOFLAGS: "-mod=vendor"
    GOPATH: "${CI_PROJECT_DIR}/.cache/gopath"
    XDG_CACHE_HOME: "${CI_PROJECT_DIR}/.cache"
  before_script:
    - cd "${CI_PROJECT_DIR}/cluster-autoscaler"
    - !reference [.mise, before_script]
    - go version
    - go env

# The runtime Dockerfile is at repository root, outside go_mod_dir. Include it
# in the producer and publisher rules so a Dockerfile-only change rebuilds the
# image with the required version and binary artifacts.
.cluster_autoscaler_artifact_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - changes:
        - cluster-autoscaler/**/*
        - Dockerfile.cluster-autoscaler-amd64
        - .gitlab-ci.yml
        - .golangci.yml
        - mise.toml
        - go.work

cluster-autoscaler/versions:
  rules: !reference [.cluster_autoscaler_artifact_rules, rules]

cluster-autoscaler/go_build:
  # Custom rules replace the shared PLATFORMS filters, so restrict the matrix too.
  parallel:
    matrix:
      - GOOS: ["linux"]
        GOARCH: ["amd64"]
  rules: !reference [.cluster_autoscaler_artifact_rules, rules]

cluster-autoscaler/pre_publish_artifacts:
  rules: !reference [.cluster_autoscaler_artifact_rules, rules]

cluster-autoscaler/publish_artifacts:
  rules: !reference [.cluster_autoscaler_artifact_rules, rules]

# Builds and provider tests consume committed vendor instead of downloaded modules.
# Custom rules also replace platform filters; keep the amd64 setup/dependency pair.
cluster-autoscaler/pre_go_deps:
  parallel:
    matrix:
      - GOARCH: "amd64"
  rules: !reference [.cluster_autoscaler_artifact_rules, rules]
  script:
    - test -f vendor/modules.txt

# Preserve the Crusoe-provider-only tests and release-branch policy. Shared tests
# cover the full upstream module and produce coverage reports.
cluster-autoscaler/go_test:
  coverage: null
  artifacts: null
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^crusoe-cluster-autoscaler-/ && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && !$CI_MERGE_REQUEST_ID'
      when: never
    - !reference [.cluster-autoscaler/go_rules, rules]
  script:
    - mise run test:provider

# Adding whole-module race/lint checks is a separate change to GitLab CI scope.
cluster-autoscaler/go_test_race:
  rules: [{ when: never }]
# Full-module generation invokes upstream AWS/Azure generators with extra
# environment/tool requirements; it needs a separate reproducible setup.
cluster-autoscaler/go_generate:
  rules: [{ when: never }]
# Dependency updates use hack/update-deps.sh (tidy then vendor). A standalone
# tidy check can be evaluated separately from this tooling migration.
cluster-autoscaler/go_mod_tidy:
  rules: [{ when: never }]
cluster-autoscaler/golangci_lint:
  rules: [{ when: never }]
# Keep documentation publication outside this migration; Pages was disabled.
cluster-autoscaler/go_publish_docs:
  rules: [{ when: never }]
publish_pages:
  rules: [{ when: never }]
